<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme Pacman</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Meme Pacman</h1>
      <p>Arrow keys / WASD to move. Grab all dots, avoid ghosts, and use baby-oil power-ups.</p>
      <div class="hud">
        <span id="score">Score: 0</span>
        <span id="lives">Lives: 3</span>
        <span id="state">State: Normal</span>
      </div>
      <canvas id="game" width="672" height="576"></canvas>
    </main>
    <script src="script.js"></script>
  </body>
</html>
